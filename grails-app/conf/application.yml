---
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
grails:
    codegen:
        defaultPackage: bpmplus
    profile: web

---
grails:
    mime:
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    views:
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                scriptlet: html
---
# La autoconfiguracion de Liquibase de Spring Boot corre un solo changelog sobre un solo
# schema. Aca los changelogs son dos y hay que recorrer N schemas, asi que la ejecuta
# SchemaMigrationService desde BootStrap y desde el alta de cada tenant.
spring:
    liquibase:
        enabled: false

management:
    endpoint:
        health:
            # El detalle del health incluye los codigos de tenant enganchados al motor, o sea la
            # lista de clientes. Se muestra solo a las cuentas de plataforma; para el resto, y
            # para el orquestador, queda el UP/DOWN, que es lo que hace falta para operar.
            show-details: when-authorized
            roles:
                - ROLE_PLATFORM_ADMIN

hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false

grails:
    gorm:
        multiTenancy:
            # Un schema (base MySQL) por tenant, compartiendo la conexion y el pool.
            mode: SCHEMA
            tenantResolverClass: bpmplus.multitenancy.TenantRegistryResolver

dataSource:
    pooled: true
    jmxExport: true
    driverClassName: com.mysql.cj.jdbc.Driver
    # MySQLDialect (Hibernate 5) es el dialecto legacy de MySQL 5.0: genera DDL con
    # "type=MyISAM", sintaxis eliminada en MySQL 5.5. MySQL8Dialect genera engine=InnoDB.
    dialect: org.hibernate.dialect.MySQL8Dialect
    # El DefaultSchemaHandler de GORM emite SET SCHEMA y no funciona en MySQL.
    schemaHandler: bpmplus.multitenancy.MySqlSchemaHandler
    # dataSource.properties.catalog (en cada entorno): es el schema MAESTRO, y esta para que el
    # pool RESTAURE ahi la conexion al devolverla. Las conexiones se apuntan al schema del tenant
    # en cada checkout (MySqlSchemaHandler), y sin esto vuelven al pool apuntando al ultimo
    # cliente que las uso: la siguiente consulta a una tabla no multi-tenant —la identidad, sin ir
    # mas lejos— aterriza en la base de ese cliente. Se veia como "Table 'acme.user' doesn't
    # exist" al iniciar sesion, y de forma intermitente, segun que conexion tocara.
    # HikariCP solo restaura si el cambio paso por setCatalog, por eso el handler ya no usa "USE".
    #
    # nullCatalogMeansCurrent=true en la url de cada entorno: sin eso, Connector/J 8+ resuelve
    # DatabaseMetaData.getTables(null, ...) contra TODAS las bases del servidor, no contra la
    # de la conexion. Con una base por cliente eso significa que preguntar "existe esta tabla"
    # da que si porque la tiene OTRO cliente. Flowable crea su esquema justo asi (ver
    # AbstractSqlScriptBasedDbSchemaManager.isTablePresent): sin la propiedad, el segundo
    # tenant se queda sin tablas ACT_* y falla en runtime.
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

environments:
    development:
        dataSource:
            # El esquema lo gobierna Liquibase, no Hibernate.
            dbCreate: none
            url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bpmplus}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true
            properties:
                catalog: ${MYSQL_DATABASE:bpmplus}
    test:
        dataSource:
            # El esquema lo gobierna Liquibase, no Hibernate.
            dbCreate: none
            url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bpmplus_test}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true
            properties:
                catalog: ${MYSQL_DATABASE:bpmplus_test}
    production:
        dataSource:
            # El esquema lo gobierna la herramienta de migraciones, no Hibernate.
            dbCreate: none
            url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=yes&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true
            properties:
                # Propiedades de HikariCP, que es el pool que realmente se usa: en el
                # classpath no esta tomcat-jdbc, asi que DataSourceBuilder elige Hikari.
                # Las propiedades anteriores (initialSize, maxActive, jdbcInterceptors...)
                # eran de Tomcat JDBC y se descartaban en silencio.
                catalog: ${MYSQL_DATABASE}
                maximumPoolSize: 50
                minimumIdle: 5
                connectionTimeout: 10000
                validationTimeout: 3000
                idleTimeout: 600000
                maxLifetime: 1800000
                keepaliveTime: 300000
                connectionTestQuery: SELECT 1
                transactionIsolation: TRANSACTION_READ_COMMITTED
                poolName: bpmplus-pool

---
# Añadido por el plugin Spring Security Core.
# La indentacion que genero s2-quickstart estaba mal: dejaba authority,
# controllerAnnotations y filterChain colgando de grails.plugin en vez de
# grails.plugin.springsecurity, con lo que el plugin los ignoraba.
grails:
    plugin:
        springsecurity:
            userLookup:
                userDomainClassName: 'bpmplus.security.User'
                authorityJoinClassName: 'bpmplus.security.UserRole'
            authority:
                className: 'bpmplus.security.Role'
            controllerAnnotations:
                staticRules:
                    - pattern: /
                      access: ['permitAll']
                    - pattern: /error
                      access: ['permitAll']
                    - pattern: /index
                      access: ['permitAll']
                    - pattern: /index.gsp
                      access: ['permitAll']
                    - pattern: /shutdown
                      access: ['permitAll']
                    - pattern: /assets/**
                      access: ['permitAll']
                    - pattern: /**/js/**
                      access: ['permitAll']
                    - pattern: /**/css/**
                      access: ['permitAll']
                    - pattern: /**/images/**
                      access: ['permitAll']
                    - pattern: /**/favicon.ico
                      access: ['permitAll']
                    # Actuator. El health tiene que ser publico: lo consulta el orquestador
                    # (ver el HEALTHCHECK del Dockerfile), que no tiene con que autenticarse.
                    # Sin detalle no dice mas que UP o DOWN; el detalle, que incluye los
                    # codigos de tenant, lo gobierna management.endpoint.health.roles.
                    - pattern: /actuator/health
                      access: ['permitAll']
                    - pattern: /actuator/health/**
                      access: ['permitAll']
                    # El resto del actuator expone configuracion y entorno: solo plataforma.
                    - pattern: /actuator/**
                      access: ['ROLE_PLATFORM_ADMIN']
                    # Login y logout: sin esto no se puede llegar al formulario,
                    # porque rejectIfNoRule esta activo por defecto.
                    - pattern: /login/**
                      access: ['permitAll']
                    - pattern: /logout/**
                      access: ['permitAll']
                    # Consola de administracion del plugin Spring Security UI.
                    # Sus controllers no llevan @Secured, asi que la regla va aca.
                    - pattern: /user/**
                      access: ['ROLE_ADMIN']
                    - pattern: /role/**
                      access: ['ROLE_ADMIN']
                    - pattern: /registrationCode/**
                      access: ['ROLE_ADMIN']
                    - pattern: /persistentLogin/**
                      access: ['ROLE_ADMIN']
                    - pattern: /requestmap/**
                      access: ['ROLE_ADMIN']
                    - pattern: /securityInfo/**
                      access: ['ROLE_ADMIN']
            filterChain:
                chainMap:
                    - pattern: /assets/**
                      filters: none
                    - pattern: /**/js/**
                      filters: none
                    - pattern: /**/css/**
                      filters: none
                    - pattern: /**/images/**
                      filters: none
                    - pattern: /**/favicon.ico
                      filters: none
                    - pattern: /**
                      filters: JOINED_FILTERS
            ui:
                # El alta por autoservicio y el "olvide mi clave" mandan mail y necesitan
                # un mailSender configurado. Se dejan apagados: en un SaaS B2B las altas
                # las hace un administrador desde /user.
                register:
                    requireEmailValidation: false
                forgotPassword:
                    requireForgotPassEmailValidation: false
